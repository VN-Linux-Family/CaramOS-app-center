name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev gettext python3
      - name: Unit tests
        run: make test
      - name: Build the package
        run: make build
      - uses: actions/upload-artifact@v5
        with:
          name: caramos-app-center-deb
          path: dist/*.deb
